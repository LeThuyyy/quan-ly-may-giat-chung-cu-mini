name: Docs check
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required docs and relative links
        run: node scripts/check-docs.mjs
